name: Publish AnyRPG A5 under /a5/ after GREEN WebGL build

on:
  workflow_run:
    workflows:
      - A5 - AnyRPG Native Mobile HUD WebGL
    branches:
      - highfly/a5-visual-recovery-20261027
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: highfly-anyrpg-a5-pages
  cancel-in-progress: false

jobs:
  deploy-dual-site:
    # Archived for A7 FULL-only Pages. Preserve all build source and historic recipes.
    # Only publish a GREEN, isolated A5 diagnostic build. Never replace stable A2/A3/A4.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified A5 mobile build
        uses: actions/download-artifact@v4
        with:
          name: HIGHFLY-ANYRPG-A5-MOBILE-TEST-WEBGL
          run-id: ${{ github.event.workflow_run.id }}
          repository: drakentzy07/HIGHFLY-ANYRPG-LAB
          github-token: ${{ github.token }}
          path: a5-download
      # Preserve the exact currently-green A2 Pages site at the repository root.
      # The A3 test lives under /a3/. A3 must never replace A2 at /.
      - name: Download current GREEN A2 + A3 + A4 Pages backup
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 40516165629
          repository: drakentzy07/HIGHFLY-ANYRPG-LAB
          github-token: ${{ github.token }}
          path: a4-pages-backup

      - name: Assemble A2/A3/A4 preserved + A5 isolated mobile lab
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip, tarfile, shutil, os

          backup=Path('a4-pages-backup')
          archives=list(backup.rglob('*.tar'))
          if len(archives)!=1: raise SystemExit('Expected exactly one GREEN A3 Pages artifact.tar, got: '+str(archives))
          root=Path('site-publish')
          if root.exists(): shutil.rmtree(root)
          root.mkdir(parents=True)
          base=root.resolve()
          # Reject symlinks/traversal instead of blindly extracting a tarball.
          with tarfile.open(archives[0], 'r:*') as tar:
              for member in tar:
                  name=member.name.removeprefix('./')
                  if not name or name=='.': continue
                  destination=(root/name).resolve()
                  if destination!=base and base not in destination.parents:
                      raise SystemExit('Unsafe path in A3 backup: '+member.name)
                  if member.isdir():
                      destination.mkdir(parents=True,exist_ok=True)
                  elif member.isfile():
                      destination.parent.mkdir(parents=True,exist_ok=True)
                      fileobj=tar.extractfile(member)
                      if fileobj is None: raise SystemExit('Unreadable A3 backup entry: '+member.name)
                      with fileobj, destination.open('wb') as output: shutil.copyfileobj(fileobj,output)
                  else:
                      raise SystemExit('Unsupported A3 backup entry: '+member.name)

          a2index=root/'index.html'
          if not a2index.exists() or 'HighflyA2MobileBridge' not in a2index.read_text(encoding='utf-8'):
              raise SystemExit('A2 backup root is not the proven A2 mobile version; refusing Pages deployment')
          a2build=root/'Build'
          if not list(a2build.glob('*.wasm')) or not list(a2build.glob('*.data')):
              raise SystemExit('A2 backup missing uncompressed Unity WebGL payload')
          a3index=root/'a3'/'index.html'
          a3build=root/'a3'/'Build'
          if not a3index.exists() or 'HIGHFLY A3' not in a3index.read_text(encoding='utf-8'):
              raise SystemExit('A3 stable backup missing: refuse to replace A3 Pages')
          if not list(a3build.glob('*.wasm')) or not list(a3build.glob('*.data')):
              raise SystemExit('A3 backup missing WebGL payload')

          a4index=root/'a4'/'index.html'
          a4build=root/'a4'/'Build'
          if not a4index.exists() or 'HIGHFLY A4' not in a4index.read_text(encoding='utf-8'):
              raise SystemExit('A4 stable backup missing: refuse to replace Pages')
          if not list(a4build.glob('*.wasm')) or not list(a4build.glob('*.data')):
              raise SystemExit('A4 backup missing WebGL payload')

          source=Path('a5-download')
          if not source.joinpath('index.html').exists(): raise SystemExit('A5 build missing')
          a5=root/'a5'
          shutil.copytree(source,a5)
          index=a5/'index.html'
          html=index.read_text(encoding='utf-8')
          if 'HIGHFLY A5' not in html: raise SystemExit('Wrong A5 mobile template')
          build=a5/'Build'
          for packed in sorted(build.glob('*.gz')):
              unpacked=packed.with_suffix('')
              with gzip.open(packed,'rb') as inp,unpacked.open('wb') as out: shutil.copyfileobj(inp,out)
              packed.unlink()
          for ext in ['.framework.js.gz','.wasm.gz','.data.gz','.symbols.json.gz']:
              html=html.replace(ext,ext[:-3])
          index.write_text(html,encoding='utf-8')
          for suffix in ('*.loader.js','*.framework.js','*.wasm','*.data'):
              if not list(build.glob(suffix)): raise SystemExit('A5 missing WebGL file: '+suffix)
          (root/'.nojekyll').touch()
          size=sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
          print('Combined A2 + A3 + A4 + A5 Pages payload',size,'bytes')
          if size>900_000_000: raise SystemExit('Site exceeds safe Pages size limit')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload versioned recovery site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-publish

      - name: Deploy A2/A3/A4 root backup and A5 test
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show A5 mobile test link
        shell: bash
        run: echo "A5 mobile test URL https://drakentzy07.github.io/HIGHFLY-ANYRPG-LAB/a5/"

